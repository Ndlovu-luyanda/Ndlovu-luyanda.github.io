<header class="main-header">
    <div class="header-container">
        <div class="logo">Portfolio<span>.</span></div>

        <nav class="horizontal-nav">
        <a routerLink="/" [fragment]="''" (click)="scrollToTop()">Home</a>
        <a routerLink="/" fragment="about">About</a>
        <a routerLink="/" fragment="services">Services</a>
        <a routerLink="/" fragment="portfolio">Portfolio</a>
        <a routerLink="/" fragment="contact">Contact</a>
            
            <button (click)="toggleTheme()" class="theme-btn">
              @if (isDarkMode()) {
              <span>☀️</span> } @else {
              <span>🌙</span> }
            </button>
        </nav>
    </div>
</header>
